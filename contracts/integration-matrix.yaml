# Day 28 Track 2 — machine-readable integration matrix.
#
# Source of truth: "Milestone 3 Demo Requirements" in the Day 28 Track 2 slide,
# which lists ten integration points that must work together.
#
# Every point below binds one slide requirement to: an owning team role, the
# input/output contract that crosses the boundary, the health signal that proves
# the boundary is alive, the test IDs that exercise it, the readiness check that
# guards it, and the artefact a team shows during the Milestone 3 demo.
#
# Consumed by:
#   - scripts/verify_matrix.py     (structure + cross-reference validation)
#   - lab28_platform.readiness     (evidence lookup)
#   - docs/curriculum/*            (student task list and rubric)

schema_version: "1"
slide: "Day 28 - Track 2 - Platform Engineering Documentation"
slide_section: "Milestone 3 Demo Requirements — 10 integration points"

roles:
  team-ingestion: "Ingestion & Orchestration — Kafka topics, producers, Airflow DAG, DLQ/replay"
  team-data: "Data & ML — Spark/Delta, Feast repository, materialization, model release"
  team-serving: "Serving & Retrieval — FastAPI orchestration, Qdrant, vLLM client, degraded paths"
  team-platform: "Platform & Observability — gateway, OTEL collector, Prometheus, Grafana, K8s/GitOps"
  team-presenter: "Presenter / Incident Commander — demo script, evidence pack, failure narration"

points:
  - id: IP01
    slide_name: "Data ingestion → Kafka"
    layer: "L2 Data"
    owner: team-ingestion
    input_contract: "contracts.FeedbackSubmission | contracts.DocumentSubmission (HTTP, via gateway)"
    output_contract: "contracts.IngestionEvent on topic data.raw, key = idempotency_key"
    health_signal: "Kafka broker reachable; data.raw topic exists with configured retention"
    metrics:
      - lab28_ingestion_events_total
      - lab28_ingestion_publish_seconds
    tests:
      - IT-J1-golden-path
      - IT-J2-idempotent-replay
      - UT-contracts-ingestion
    readiness_check: reliability.kafka_topics
    demo_evidence: "evidence/ip01-kafka-consume.json — message with traceparent header on data.raw"

  - id: IP02
    slide_name: "Kafka → Airflow pipeline"
    layer: "L2 Data"
    owner: team-ingestion
    input_contract: "contracts.IngestionEvent consumed from data.raw with W3C traceparent header"
    output_contract: "Airflow 3 asset event on asset lab28://delta/feedback; run_id recorded"
    health_signal: "Airflow api-server /api/v2/monitor/health reports scheduler+triggerer healthy"
    metrics:
      - lab28_pipeline_batches_total
      - lab28_consumer_lag
    tests:
      - IT-J1-golden-path
      - IT-J4-degraded-recovery
    readiness_check: reliability.airflow_pipeline
    demo_evidence: "evidence/ip02-airflow-run.json — DAG run id, task states, asset event"

  - id: IP03
    slide_name: "Pipeline → Delta Lake / Lakehouse"
    layer: "L2 Data"
    owner: team-data
    input_contract: "Batch of contracts.IngestionEvent (deduplicated by idempotency_key)"
    output_contract: "Delta MERGE into feedback/documents tables; new table version; _delta_log entry"
    health_signal: "DeltaTable.history() readable and version monotonically increasing"
    metrics:
      - lab28_delta_version
      - lab28_delta_rows_written_total
    tests:
      - IT-J1-golden-path
      - IT-J2-idempotent-replay
      - UT-delta-merge-idempotency
    readiness_check: reliability.delta_transaction_log
    demo_evidence: "evidence/ip03-delta-history.json — transaction log, schema, time travel diff"

  - id: IP04
    slide_name: "Lakehouse → Feature Store (Feast)"
    layer: "L3 ML"
    owner: team-data
    input_contract: "Delta-derived offline snapshot at delta_root/exports/asker_activity"
    output_contract: "Feast online store rows for entity asker_id; feature service asker_serving_v1"
    health_signal: "Feast feature server /health 200 and get-online-features returns the entity"
    metrics:
      - lab28_feature_lookup_seconds
      - lab28_feature_freshness_seconds
    tests:
      - IT-J1-golden-path
      - IT-J4-degraded-recovery
    readiness_check: reliability.feature_store
    demo_evidence: "evidence/ip04-feast-online.json — entity row with delta_version and freshness"

  - id: IP05
    slide_name: "Data → Vector Store (embeddings)"
    layer: "L2 Data"
    owner: team-serving
    input_contract: "Document rows from Delta + pinned embedding model"
    output_contract: "Qdrant points in lab28_documents with deterministic UUID from doc_id"
    health_signal: "Qdrant /readyz 200 and collection point count > 0"
    metrics:
      - lab28_retrieval_seconds
      - lab28_vector_points
    tests:
      - IT-J1-golden-path
      - IT-J2-idempotent-replay
      - UT-vector-stable-ids
    readiness_check: reliability.vector_store
    demo_evidence: "evidence/ip05-qdrant-search.json — hybrid query result with scores and doc_ids"

  - id: IP06
    slide_name: "MLflow → Model Registry"
    layer: "L3 ML"
    owner: team-data
    input_contract: "Evaluation run over the Delta version + retrieval config + vLLM model id"
    output_contract: "Registered model version with signature, tags, provenance and champion alias"
    health_signal: "MLflow /health 200 and get_model_version_by_alias(champion) resolves"
    metrics:
      - lab28_release_version_info
    tests:
      - IT-J1-golden-path
      - IT-J3-promotion-rollback
      - UT-release-provenance
    readiness_check: operations.model_rollback
    demo_evidence: "evidence/ip06-mlflow-release.json — version, signature, git sha, delta version"

  - id: IP07
    slide_name: "Model → vLLM / SGLang serving"
    layer: "L1 Compute"
    owner: team-serving
    input_contract: "Grounded prompt built from champion release config + retrieved sources"
    output_contract: "OpenAI-compatible chat completion from a real vLLM server; model id echoed"
    health_signal: "vLLM /health 200, /version reports a vLLM build, /metrics exposes vllm: series"
    metrics:
      - lab28_llm_seconds
      - lab28_llm_tokens_total
    tests:
      - IT-J1-golden-path
      - IT-J3-promotion-rollback
      - IT-J4-degraded-recovery
    readiness_check: reliability.inference_endpoint
    demo_evidence: "evidence/ip07-vllm-identity.json — /version + /v1/models + vllm: metric names"
    gate: gpu
    gate_note: >-
      Requires a real GPU-backed vLLM 0.28 endpoint. A mock, a CPU classifier or
      any server that cannot produce vLLM's own /version and vllm: metrics fails
      this gate by design.

  - id: IP08
    slide_name: "Serving → API Gateway"
    layer: "L1 Compute"
    owner: team-platform
    input_contract: "External HTTP request to the gateway listener"
    output_contract: "Routed request with x-request-id; rate limit, auth policy and health routing"
    health_signal: "Gateway admin /ready 200; /healthz route answers without hitting the app"
    metrics:
      - envoy_http_downstream_rq_total
      - envoy_http_local_rate_limit_rate_limited
    tests:
      - IT-J1-golden-path
      - IT-J5-trace-metrics-continuity
      - IT-gateway-rate-limit
    readiness_check: security.gateway_policy
    demo_evidence: "evidence/ip08-gateway.json — 200 + 429 responses with x-request-id"

  - id: IP09
    slide_name: "All components → Prometheus / Grafana"
    layer: "L4 Ops"
    owner: team-platform
    input_contract: "Prometheus scrape of every service that exposes /metrics"
    output_contract: "Provisioned Grafana dashboards and at least one actionable SLO alert"
    health_signal: "Prometheus /api/v1/targets shows all expected jobs up"
    metrics:
      - up
      - lab28_request_seconds
    tests:
      - IT-J5-trace-metrics-continuity
      - IT-prometheus-targets
    readiness_check: observability.metrics_and_alerts
    demo_evidence: "evidence/ip09-prometheus-targets.json + evidence/ip09-grafana-dashboards.json"

  - id: IP10
    slide_name: "All components → LangSmith tracing"
    layer: "L4 Ops"
    owner: team-platform
    input_contract: "OTLP spans from gateway, API, Kafka, Airflow, Spark, Feast, Qdrant, vLLM"
    output_contract: "One trace ID spanning every boundary, exported to a local backend and LangSmith"
    health_signal: "Collector pipeline healthy; trace queryable by ID in the local backend"
    metrics:
      - otelcol_exporter_sent_spans
      - otelcol_exporter_send_failed_spans
    tests:
      - IT-J5-trace-metrics-continuity
      - IT-trace-span-coverage
    readiness_check: observability.trace_continuity
    demo_evidence: "evidence/ip10-trace.json — trace ID with the required span names"
    gate: langsmith
    gate_note: >-
      The local OTLP backend provides deterministic offline and CI evidence. The
      LangSmith leg additionally requires LANGSMITH_API_KEY in the environment
      and is reported UNVERIFIED when no credential is supplied.

# The five live critical journeys required by the slide's integration testing
# strategy. Each maps to a module in integration-tests/.
critical_journeys:
  - id: IT-J1-golden-path
    title: "Golden path across all ten integration points"
    module: integration-tests/test_j1_golden_path.py
    covers: [IP01, IP02, IP03, IP04, IP05, IP06, IP07, IP08, IP09, IP10]

  - id: IT-J2-idempotent-replay
    title: "Duplicate/replay idempotency across Kafka, Delta, Feast and Qdrant"
    module: integration-tests/test_j2_idempotent_replay.py
    covers: [IP01, IP02, IP03, IP04, IP05]

  - id: IT-J3-promotion-rollback
    title: "New release, champion promotion, serving change and rollback"
    module: integration-tests/test_j3_promotion_rollback.py
    covers: [IP06, IP07]

  - id: IT-J4-degraded-recovery
    title: "Dependency failure, retry/DLQ/degraded response and recovery without data loss"
    module: integration-tests/test_j4_degraded_recovery.py
    covers: [IP02, IP04, IP05, IP07]

  - id: IT-J5-trace-metrics-continuity
    title: "Trace, metrics and readiness continuity end to end"
    module: integration-tests/test_j5_trace_metrics_continuity.py
    covers: [IP08, IP09, IP10]

# Required span names for IP10. A trace missing any of these fails the gate.
required_spans:
  - lab28.gateway.request
  - lab28.api.ingest
  - lab28.kafka.produce
  - lab28.kafka.consume
  - lab28.airflow.dag
  - lab28.spark.delta_merge
  - lab28.api.ask
  - lab28.feast.get_online_features
  - lab28.qdrant.query
  - lab28.mlflow.resolve_release
  - lab28.vllm.chat_completion

# Milestone 3 rubric, reproduced verbatim from the slide.
rubric:
  - criterion: "Integration Completeness"
    weight: 40
    description: "All 10 integration points working, data flows end-to-end"
  - criterion: "Observability"
    weight: 25
    description: "Logs, metrics, traces visible; alerts configured; SLO dashboard"
  - criterion: "Performance"
    weight: 20
    description: "Latency within SLO; load tested; no memory leaks"
  - criterion: "Architecture Quality"
    weight: 15
    description: "Clean separation, GitOps config, documented decisions"
