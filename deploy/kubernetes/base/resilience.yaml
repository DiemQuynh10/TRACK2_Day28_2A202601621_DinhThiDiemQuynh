apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: lab28-api
  namespace: lab28
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: lab28-api
  minReplicas: 2
  maxReplicas: 8
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: lab28-api
  namespace: lab28
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lab28-api
      app.kubernetes.io/part-of: lab28-platform
