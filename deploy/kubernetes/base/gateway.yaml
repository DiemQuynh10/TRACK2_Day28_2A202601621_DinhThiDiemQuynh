apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: lab28
  namespace: lab28
spec:
  gatewayClassName: envoy-gateway
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lab28-api
  namespace: lab28
spec:
  parentRefs:
    - name: lab28
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: lab28-api
          port: 8000
