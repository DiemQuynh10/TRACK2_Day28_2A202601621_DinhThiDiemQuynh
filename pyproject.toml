[project]
name = "day28-platform-student"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = ["pydantic==2.12.5", "pyyaml==6.0.3"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
